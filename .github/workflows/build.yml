name: Build GK Bulk Email Sender

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ── Mac .app ──────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Mac app
        run: |
          pyinstaller \
            --onedir \
            --windowed \
            --name "GK_Bulk_Email_Sender" \
            gk_bulk_sender.py

      - name: Create first-launch helper script
        run: |
          echo '#!/bin/bash' > dist/첫실행_여기클릭.command
          echo 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> dist/첫실행_여기클릭.command
          echo 'xattr -cr "$DIR/GK_Bulk_Email_Sender.app"' >> dist/첫실행_여기클릭.command
          echo 'open "$DIR/GK_Bulk_Email_Sender.app"' >> dist/첫실행_여기클릭.command
          chmod +x dist/첫실행_여기클릭.command

      - name: Zip (app + helper script only)
        run: |
          cd dist
          zip -r GK_Bulk_Email_Sender_Mac.zip \
            GK_Bulk_Email_Sender.app \
            첫실행_여기클릭.command

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: GK_Bulk_Email_Sender_Mac
          path: dist/GK_Bulk_Email_Sender_Mac.zip
          retention-days: 30

  # ── Windows .exe ─────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Windows exe (single file)
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "GK_Bulk_Email_Sender" `
            gk_bulk_sender.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GK_Bulk_Email_Sender_Windows
          path: dist/GK_Bulk_Email_Sender.exe
          retention-days: 30
